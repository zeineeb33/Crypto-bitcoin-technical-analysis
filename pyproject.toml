[project]
name = "cryptosignal"
version = "0.1.0"
description = "Crypto technical-analysis pipeline: ingestion, validation, leakage-free features, walk-forward backtesting and a FastAPI signal service."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Zeineb Jemli" }]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.156.8",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "threadpoolctl>=3.7.0",
    "typer>=0.27.3",
    "uvicorn>=0.54.0",
    "yfinance>=1.7.0",
]

[project.scripts]
cryptosignal = "cryptosignal.cli:app"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cryptosignal"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["notebooks"]  # original exploratory notebook, kept as-is

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PTH", "N", "PL", "NPY", "PD"]
ignore = [
    "PLR0913", # many keyword arguments is fine for config-driven functions
    "PLR2004", # magic values are fine in thresholds
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "PLC0415"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --disable-socket --allow-unix-socket"

[tool.coverage.run]
source = ["cryptosignal"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "\\.\\.\\."]

[tool.mypy]
plugins = ["pydantic.mypy"]
python_version = "3.12"
files = ["src"]
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
ignore_missing_imports = true

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-socket>=0.8.1",
    "ruff>=0.17.1",
    "types-pyyaml>=6.0.12.20260906",
]
