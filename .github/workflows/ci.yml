name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          version: "0.12.21"
          enable-cache: true
      - run: uv sync --frozen
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Tests (network disabled)
        run: uv run pytest --cov --cov-report=term --cov-fail-under=85

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t cryptosignal:ci .
      - name: Smoke test /health
        run: |
          docker run -d --name app -p 8000:8000 -e CRYPTOSIGNAL_SERVE__WARMUP=false cryptosignal:ci
          for i in $(seq 1 30); do curl -fsS localhost:8000/health && exit 0; sleep 1; done
          docker logs app; exit 1
